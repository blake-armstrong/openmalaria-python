[project]
name = "openmalaria-tools"
version = "0.2.0"
description = "Helpers for analysing OpenMalaria output from Python"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-2.0-or-later" }
dependencies = ["openmalaria>=0.2.0", "numpy>=1.20", "pandas>=1.3"]

[project.optional-dependencies]
mpi = ["mpi4py"]
test = ["pytest"]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
openmalaria = { path = "../openmalaria-nanobind", editable = true }

[dependency-groups]
dev = [
    "basedpyright>=1.40.1; python_version >= '3.10'",
    "pandas-stubs",
    "pytest>=8",
    "ruff>=0.16.8",
]

[tool.basedpyright]
include = ["src", "tests"]
extraPaths = ["tests"]
pythonVersion = "3.9"
reportAny = false
reportExplicitAny = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportMissingParameterType = false
reportUnannotatedClassAttribute = false
reportMissingTypeStubs = false
reportUnusedCallResult = false
reportImplicitStringConcatenation = false
reportImplicitOverride = false

[tool.pytest.ini_options]
testpaths = ["tests"]
