name: Publish

on:
  push:
    tags: "v*"
  workflow_dispatch:
    inputs:
      upload_to_testpypi:
        description: 'Upload to TestPyPI (dry run)'
        required: false
        type: boolean
        default: false
      upload_to_pypi:
        description: 'Upload to PyPI'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5

      - name: Build sdist and wheel
        run: uv build --no-sources

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  upload_pypi:
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: pypi
      url: https://pypi.org/p/openmalaria-tools/
    permissions:
      id-token: write
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.upload_to_pypi)
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@v1.12.4
        with:
          skip-existing: true
          print-hash: true

  upload_testpypi:
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: testpypi
      url: https://test.pypi.org/p/openmalaria-tools/
    permissions:
      id-token: write
    if: github.event_name == 'workflow_dispatch' && inputs.upload_to_testpypi
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@v1.12.4
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          print-hash: true
